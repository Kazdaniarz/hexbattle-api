<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" role="img" aria-labelledby="t d">
<title id="t">Tile geometry: edges, corners and badge slots</title>
<desc id="d">A flat-top hex, unrotated, edge 0 up. Edges 0 to 5 clockwise from the top (N, NE, SE, S, SW, NW); corners 0 to 5 clockwise from the upper right; twelve badge slots e0 c0 e1 c1 ... e5 c5 at 30 degree steps, e k pointing at edge k, c k at corner k.</desc>
<rect width="760" height="668" rx="16" fill="#110f0c"/>
<text x="32" y="46" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ece6d8">Tile geometry – the unrotated face</text>
<text x="32" y="74" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49e90">Edge 0 up, every number goes clockwise. Badges sit in one of 12 slots.</text>
